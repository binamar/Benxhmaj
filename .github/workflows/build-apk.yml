name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export debug APK with Godot
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/root
          mkdir -p "$HOME/.config/godot"

          echo "== Export templates =="
          ls "$HOME/.local/share/godot/export_templates/"

          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          echo "SDK=$SDK JAVA=$JAVA"

          if [ ! -f "$HOME/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
          fi

          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

          cd godot_benchmark
          mkdir -p build
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android" build/benchmark.apk
          ls -la build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-apk
          path: godot_benchmark/build/benchmark.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Benchmark APK v1.0.${{ github.run_number }}
          body: |
            Android APK (debug-signed) built automatically with Godot 4.3 via GitHub Actions.
            Commit: ${{ github.sha }}
          files: godot_benchmark/build/benchmark.apk
