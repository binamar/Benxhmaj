name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export debug APK with Godot
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/root
          mkdir -p "$HOME/.config/godot"

          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          echo "SDK=$SDK JAVA=$JAVA"

          echo "== Install matching Android SDK packages =="
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(which sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" > /dev/null

          if [ ! -f "$HOME/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
          fi

          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

          echo "== DIAG templates =="
          ls -la "$HOME/.local/share/godot/export_templates/" "$HOME/.local/share/godot/export_templates/4.3.stable" | head -60
          echo "== DIAG sdk =="
          ls -la "$SDK/cmdline-tools" "$SDK/cmdline-tools/latest/bin" || true
          ls "$SDK/platform-tools" | head
          echo "== DIAG keystore =="
          ls -la "$HOME/debug.keystore"
          echo "== DIAG settings =="
          cat "$HOME/.config/godot/editor_settings-4.3.tres" | head -40

          cd godot_benchmark
          mkdir -p build
          godot --headless --import || true
          echo "== EXPORT =="
          godot --headless --verbose --export-debug "Android" build/benchmark.apk 2>&1 | grep -v "not exposed" | tail -n 80
          ls -la build
          test -f build/benchmark.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-apk
          path: godot_benchmark/build/benchmark.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Benchmark APK v1.0.${{ github.run_number }}
          body: |
            Android APK (debug-signed) built automatically with Godot 4.3 via GitHub Actions.
            Commit: ${{ github.sha }}
          files: godot_benchmark/build/benchmark.apk
